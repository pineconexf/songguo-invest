# 探针/扫描器屏蔽（2026-09-18，纯静态 Astro 站专用）
# 这些路径本站必然不存在；返回 444 = nginx 直接断连不回应，
# 比 404 更省（不喂响应体、不给扫描器"路径存在与否"的信号）。
# 放行：/.well-known/*（证书续签 acme-challenge 必须可达）
# 位置说明：放在 location / 与 location = /api/check 之前会被按序命中；
#           与已存在的 /api/ 前缀块不冲突（那些是真实代理端点）。
location ~ /\. { access_log off; return 444; }
location ~* (wp-login|wp-admin|wp-content|wp-includes|wp-cron|wordpress|xmlrpc|phpmyadmin|pma|adminer|owa/|autodiscover|/\.env|\.env$|\.git/|\.git$|\.svn|\.hg|\.aws|phpinfo|\.php$|\.php\?|\.asp|\.aspx|\.jsp|\.cgi|\.pl$|/backup|/dump|/setup|/install\.php|/config\.inc) {
    access_log off;
    return 444;
}
